<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERDJM</title>

    <script src="https://kit.fontawesome.com/496892164a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <nav class="sidebar">
            <div class="nav-logo">
                <img src="img/IMG-BIBLIOTECA.png" alt="IMG-BIBLIOTECA">
                <h2 id="nav-biblioteca">Biblioteca</h2>
            </div>
            <div class="nav-Esc">
                <h2>Erem Dr. Jaime Monteiro</h2>
            </div>
            <div class="nav-pgn-inical">
                <button>
                    <i class="fa-regular fa-house"></i>
                    <span id="nav-inicio">Início</span>
                </button>
            </div>
            <div class="nav-lista">
                <button>
                    <i class="fa-regular fa-heart"></i>
                    <span id="nav-lista">Minha Lista</span>
                </button>
            </div>
            <div class="nav-lendo">
                <button>
                    <i class="fa-solid fa-book-open-reader"></i>
                    <span id="nav-lendo">Continuar Lendo</span>
                </button>
            </div>
            <div class="nav-lido">
                <button>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span id="nav-lidos">Livros Lidos</span>
                </button>
            </div>
            <div class="nav-reservado">
                <button>
                    <i class="fa-regular fa-bookmark"></i>
                    <span id="nav-reservados">Livros Reservados</span>
                </button>
            </div>

        </nav>

        <main>
            <header class="topo">

                <div class="acoes-topo">

                    <!-- TEMA -->
                    <div class="tema">
                        <button id="alternar-tema">
                            <i class="fa-solid fa-circle-half-stroke"></i>
                        </button>
                    </div>

                    <!-- ACESSIBILIDADE -->
                    <div class="acessibilidade">
                        <button id="aumentar-fonte">A+</button>
                        <button id="diminuir-fonte">A-</button>
                    </div>

                    <!-- IDIOMA -->
                    <div class="idioma-container">
                        <button class="idioma">
                            <span id="idioma-texto">Português</span>
                            <i class="fa-solid fa-angle-down"></i>
                        </button>

                        <div class="idioma-menu">
                            <button data-lang="pt">Português</button>
                            <button data-lang="en">English</button>
                            <button data-lang="es">Español</button>
                        </div>
                    </div>

                </div>

            </header>
            <div class="busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="busca-texto" type="text" placeholder="Digite o nome do livro ou autor(a) que deseja buscar">
            </div>

            <h2 id="sugestoes">Sugestões de leitura</h2>

            <h2 id="continuar">
                Continue Lendo
                <i class="fa-solid fa-angle-right"></i>
            </h2>

            <h2 id="minhaLista">
                Minha Lista
                <i class="fa-solid fa-angle-right"></i>
            </h2>

            <p id="descricao">
                Escolha livros que deseja ler e armazene em sua lista para acessar rapidamente quando precisar.
            </p>

        </main>

    </div>
    <script src="script.js"></script>
</body>

</html>
