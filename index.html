<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERDJM</title>
    <script src="https://kit.fontawesome.com/496892164a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="nav-logo">
                <img src="img/IMG-BIBLIOTECA.png" alt="IMG-BIBLIOTECA">
                <h2> Biblioteca </h2>
            </div>
            <div class="nav-Esc">
                <h2>Erem Dr. Jaime Monteiro</h2>
            </div>
            <div class="nav-pgn-inical">
                <button>
                    <i class="fa-regular fa-house"></i>
                    Início
                </button>
            </div>
            <div class="nav-lista">
                <button>
                <i class="fa-regular fa-heart"></i>
                    Minha Lista
            </button>
            </div>
            <div class="nav-lendo">
                <button>
                    <i class="fa-solid fa-book-open-reader"></i>
                    Continuar Lendo
                </button>
            </div>
            <div class="nav-lido">
                
                <button>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Livros Lidos
                </button>
                
            </div>
            <div class="nav-reservado">
                <button>
                    <i class="fa-regular fa-bookmark"></i>
                    Livros Reservados
                </button>
            </div> 
        </nav>
        <main>
            <header>
                <button class="idioma">
                    Português
                    <i class="fa-solid fa-angle-down"></i>
                </button>
                <div class="acessibilidade">
                    <button id="aumentar-fonte">A+</button>
                    <button id="diminuir-fonte">A-</button>
                </div>
                <div class="tema">
                    <button id="alternar-tema" aria-label="Alternar tema claro e escuro">
                        <span class="icone-lua">🌙</span>
                         <span class="icone-sol">☀️</span>
                    </button>
                </div>
            </header>
                <div class="busca">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Digite o nome do livro ou autor(a) que deseja buscar">
                </div>
                <H2>Sugestões de leitura</H2>
                <h2>
                    Continue Lendo 
                    <i class="fa-solid fa-angle-right"></i>
                </h2>
                <h2> Minha Lista
                    <i class="fa-solid fa-angle-right"></i>
                </h2>
                <p>Escolha livros que deseja ler e armazene em sua lista para acessar rapidamente quando precisar.</p>
        </main>
    </div>
</body>
</html>
